<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#092D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I Was Here">
<meta name="description" content="I Was Here — Places & Memories: an interactive atlas of Poland with real relief, 16 provinces and 14 cities, trip plans and day plans.">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./assets/atlas.css">
<link rel="stylesheet" href="./assets/atlas-light-v5.css">
<link rel="stylesheet" href="./assets/atlas-premium.css">
<link rel="stylesheet" href="./assets/place-extras.css">
<title>I Was Here — Poland Atlas</title>
</head>
<body data-style="atlas">
<main id="atlasApp">
  <div class="atlas-map">
    <svg id="polandSvg" viewBox="0 0 900 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interactive map of Poland with 14 cities and 16 provinces"></svg>
  </div>

  <header class="atlas-top">
    <a class="brand" href="./atlas.html" aria-label="I Was Here — Poland Atlas">
      <span class="brand-logo" aria-hidden="true"><img src="./assets/brand-atlas.svg" alt="" width="54" height="56"></span>
      <span class="brand-name"><strong>I Was Here</strong><small id="atlasSubtitle">Places &amp; Memories</small></span>
    </a>
    <p class="tagline" id="atlasTagline">Explore Poland · Collect places · Create memories</p>
    <div class="atlas-actions">
      <button class="pill search-toggle" id="searchButton" type="button" aria-label="Search cities and provinces" aria-expanded="false">⌕</button>
      <button class="pill language lang-switch" id="langButton" type="button" aria-label="Language: English. Switch to Polish"><span data-lang="pl">PL</span><span data-lang="en" class="on">EN</span></button>
    </div>
  </header>
  <div class="searchbox" id="searchBox">
    <input type="search" id="searchInput" placeholder="Search cities, provinces, towns…" autocomplete="off" aria-label="Search">
    <button type="button" id="searchClose" aria-label="Close search">✕</button>
  </div>

  <div class="map-controls" role="group" aria-label="Map controls">
    <button class="round" id="layersButton" type="button" aria-label="Layers" aria-expanded="false" aria-controls="layersPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-7.6 9.3L2 13.6 12 19l10-5.4-2.4-1.3L12 16.4l-7.6-4.1Z"/></svg></button>
    <button class="round" id="zoomIn" aria-label="Zoom in" type="button">+</button>
    <button class="round" id="zoomOut" aria-label="Zoom out" type="button">−</button>
  </div>
  <section class="layers-panel" id="layersPanel" hidden aria-labelledby="layersTitle">
    <h2 id="layersTitle">Layers</h2>
    <label class="switch"><input type="checkbox" data-layer="borders" checked><span id="layerBorders">Province borders</span></label>
    <label class="switch"><input type="checkbox" data-layer="names" checked><span id="layerNames">Province names</span></label>
    <label class="switch"><input type="checkbox" data-layer="relief" checked><span id="layerRelief">Terrain relief</span></label>
    <label class="switch"><input type="checkbox" data-layer="towns" checked><span id="layerTowns">Towns and places</span></label>
    <label class="switch"><input type="checkbox" data-layer="landmarks" checked><span id="layerLandmarks">Landmark illustrations</span></label>
    <h3 id="styleTitle">Map style</h3>
    <div class="style-panel" role="group" aria-labelledby="styleTitle">
      <button id="styleAtlas" type="button" class="active">Atlas</button>
      <button id="styleLight" type="button">Light</button>
      <button id="styleNight" type="button">Night</button>
      <button id="styleTerrain" type="button">Terrain</button>
    </div>
  </section>

  <div class="map-legend" aria-hidden="true">
    <svg class="compass" viewBox="0 0 40 40"><path d="M20 2 23 17 38 20 23 23 20 38 17 23 2 20 17 17Z" fill="currentColor" opacity=".85"/><path d="M20 2 23 17 20 20Z" fill="#F47C28"/><text x="20" y="-1" text-anchor="middle">N</text></svg>
    <div class="scale"><span class="scale-bar" id="scaleBar"></span><span class="scale-text" id="scaleText">100 km</span></div>
  </div>
  <div class="attribution" id="atlasFooter">Natural Earth · Terrain Tiles (SRTM, EU-DEM © Copernicus)</div>

  <button class="poland-home" id="resetView" type="button" aria-label="Show all of Poland" title="Show all of Poland"><img src="./assets/poland-mark.svg" alt="" width="40" height="38"><span id="homeLabel">Poland</span></button>

  <section class="atlas-bottom" aria-label="Choose a city or province">
    <div class="browse-title"><span id="citiesTitle">Choose a city</span><span id="cityStatus">Guide available</span></div>
    <div class="city-strip" id="cityStrip" role="list"></div>
    <div class="city-strip region-strip" id="regionStrip" role="list" aria-label="Provinces"></div>
    <div class="city-card place-sheet" id="placeSheet" hidden>
      <button class="sheet-x" id="sheetClose" type="button" aria-label="Close">✕</button>
      <div class="sheet-head"><span class="sheet-thumb" id="sheetThumb" aria-hidden="true"></span>
        <div class="city-title"><strong id="cityName">Warsaw</strong><span class="status-badge" id="sheetBadge"></span><span id="cityDescription">184 sights • 18 districts • 36 places to eat</span></div></div>
      <div class="card-towns" id="cardTowns" hidden></div>
      <ul class="sheet-places" id="sheetPlaces" hidden></ul>
      <div class="sheet-actions">
        <button id="cityAction" class="city-action" type="button">Explore Warsaw</button>
        <button id="addTrip" class="act" type="button" aria-label="Add to a trip plan"><span aria-hidden="true">🧳</span><b id="addTripLabel">Trip plan</b></button>
        <button id="addDay" class="act" type="button" aria-label="Add to a day plan"><span aria-hidden="true">🗓️</span><b id="addDayLabel">Day plan</b></button>
        <button id="toggleVisited" class="act" type="button" aria-pressed="false" aria-label="I was here"><span aria-hidden="true">✓</span><b id="visitedLabel">I was here</b></button>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tabPanel" hidden aria-live="polite"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="picker" id="planPicker" aria-labelledby="pickerTitle"></dialog>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="map" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 2 6 2v10l-6-2V6Z"/></svg><b id="tabMap">Map of Poland</b></button>
    <button type="button" data-tab="trips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg><b id="tabTrips">Trip plan</b></button>
    <button type="button" data-tab="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm-2 7h14v11H5V9Zm2 2v2h2v-2H7Zm4 0v2h2v-2h-2Z"/></svg><b id="tabDay">My day plan</b></button>
    <button type="button" data-tab="memories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 12.5V18h14v-3l-4-4-4 4-2-2-4 3.5ZM8.5 7A1.5 1.5 0 1 0 8.5 10 1.5 1.5 0 0 0 8.5 7Z"/></svg><b id="tabMemories">Memories</b></button>
    <button type="button" data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg><b id="tabProfile">Profile</b></button>
  </nav>
</main>
<script src="./assets/brand-v5.js"></script>
<script src="./assets/poland-geography.js"></script>
<script src="./data/regiony.js"></script>
<script src="./assets/atlas-illustrated.js"></script>
<script src="./assets/place-extras.js"></script>
<script src="./assets/atlas-plans.js"></script>
<script src="./assets/atlas.js"></script>
</body>
</html>
