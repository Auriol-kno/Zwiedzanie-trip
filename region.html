<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="I Was Here">
<meta name="description" content="I Was Here — Places & Memories: regional sightseeing guide with curated places, a day planner and travel stamps.">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="./assets/region.css">
<link rel="stylesheet" href="./assets/nav4.css">
<link rel="stylesheet" href="./assets/brand-v5.css">
<link rel="stylesheet" href="./assets/place-extras.css">
<link rel="stylesheet" href="./assets/app-nav.css">
<link rel="stylesheet" href="./assets/explore-themes.css">
<script src="./assets/brand-v5.js"></script>
<title>I Was Here — Regional guide</title>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand" aria-label="I Was Here — Places &amp; Memories" role="img"><div class="mark mark-pin"><img src="./assets/brand-pin-landscape.svg" alt="" width="41" height="56"></div><div class="wordmark"><small>PLACES &amp; MEMORIES</small><b>I WAS HERE</b></div></div>
  <a class="poland-fab" id="atlasFloat" href="./atlas.html" title="Whole map of Poland" aria-label="Show the whole map of Poland"><img src="./assets/brand-mark.svg" alt="" width="48" height="48"></a><div class="top-actions">
    <button class="lang-switch" id="langRegion" type="button" aria-label="Language: English. Switch to Polish"><span data-lang="pl">PL</span><span data-lang="en" class="on">EN</span></button>
    <button class="icon-btn labeled" id="savedBtn" type="button" aria-pressed="false"><span aria-hidden="true">♡</span><small id="savedLabel">Saved</small></button>
  </div>
</header>

<section class="hero">
  <div class="eyebrow" id="rEyebrow">Province · regional guide</div>
  <h1 id="rTitle">Region</h1>
  <p id="rLead"></p>
  <div class="hero-art" id="rArt" aria-hidden="true"></div>
</section>

<section class="stats" aria-live="polite">
  <div class="stat"><small id="statPlacesLabel">Sights</small><strong id="statPlaces">–</strong></div>
  <div class="stat"><small id="statTownsLabel">Towns</small><strong id="statTowns">–</strong></div>
  <div class="stat"><small id="statStampsLabel">Your stamps</small><strong id="statStamps">0</strong></div>
</section>

<div id="cityLinks"></div>

<section class="filters" id="filtersSection" aria-labelledby="filtersTitle">
  <div class="section-title"><div><h2 id="filtersTitle">What to show on the map</h2><p class="subheading" id="filtersSub">Pick a town and the types of places — the map and the list update together</p></div></div>
  <div class="chips" id="townChips"></div>
  <div class="chips" id="catChips"></div>
  <label class="search"><span id="searchLabel">Search</span><input id="rSearch" type="search" autocomplete="off"></label>
</section>

<section id="mapSection">
  <div class="section-title"><h2 id="mapTitle">Map</h2><button class="textbtn" id="fitMap" type="button">⌖ Fit</button></div>
  <div class="map-wrap"><div id="rMap" role="application" aria-label="Map"></div></div>
</section>


<section id="planSection" class="card">
  <div class="section-title"><div><h2 id="planTitle">Day plan</h2><p class="subheading" id="planSub"></p></div></div>
  <div class="plan-grid">
    <label class="field"><span id="planStartLabel">Start</span><select id="planStart"></select></label>
    <label class="field"><span id="planClockLabel">Start time</span><input id="planClock" type="time" value="10:00"></label>
  </div>
  <div class="range-head"><span id="planHoursLabel">Time</span><em id="planHoursValue">6 h</em></div>
  <input id="planHours" type="range" min="2" max="12" step="1" value="6" aria-labelledby="planHoursLabel">
  <div class="modes" id="planMode">
    <button type="button" data-mode="walking"><span aria-hidden="true">🚶</span><b id="modeWalk">Walk</b></button>
    <button type="button" data-mode="driving" class="active"><span aria-hidden="true">🚗</span><b id="modeCar">Car</b></button>
    <button type="button" data-mode="transit"><span aria-hidden="true">🚌</span><b id="modeTransit">Public transport</b></button>
  </div>
  <ol class="plan-list" id="planList"></ol>
  <div class="plan-actions"><a class="btn" id="planMaps" href="#" target="_blank" rel="noopener">🧭 Google Maps</a></div>
  <p class="note" id="planNote"></p>
</section>

<section id="placesSection">
  <div class="section-title"><div><h2 id="placesTitle">Places</h2><p class="subheading" id="placesCount"></p></div></div>
  <div class="places" id="placeList"></div>
</section>

<footer class="footer" id="rFooter"></footer>
</div>

<nav class="app-nav" id="appNav" data-page="region"></nav>

<div class="overlay" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle"><div class="sheet"><button class="sheet-close" type="button" id="dClose" aria-label="Close">✕</button><div id="dBody"></div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="./assets/poland-geography.js"></script>
<script src="./data/regiony.js"></script>
<script src="./assets/atlas-illustrated.js"></script>
<script src="./assets/place-extras.js"></script>
<script src="./assets/explore-themes.js"></script>
<script src="./assets/region.js"></script>
<script src="./assets/app-nav.js"></script>
</body>
</html>
