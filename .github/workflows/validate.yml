name: Sprawdź aplikację Warszawa
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zweryfikuj bazy danych
        run: |
          python tools/sync_database.py
          git diff --exit-code -- data/atrakcje.js data/restauracje.js
      - name: Test interfejsu i schematów
        run: python tools/test_bundle.py
      - name: Test Atlasu Polski i PL/EN
        run: python tools/test_atlas.py
      - name: Test składni JavaScript
        run: |
          node --check assets/features3.js
          node --check assets/atlas.js
          node --check assets/atlas-illustrated.js
          node --check assets/poland-geography.js
          node --check assets/brand-v5.js
          node --check assets/i18n4.js
          node --check data/atrakcje.js
          node --check data/restauracje.js
          node --check service-worker.js
