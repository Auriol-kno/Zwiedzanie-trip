name: Generate I Was Here app icons
on:
  push:
    branches: [main]
    paths:
      - "icon.svg"
      - "assets/brand-pin.svg"
      - "tools/render_icons.py"
      - ".github/workflows/sync-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vector renderer
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.7.1"
      - name: Render PNG icons
        run: python tools/render_icons.py
      - name: Commit icons if changed
        run: |
          if ! git diff --quiet -- icon-180.png icon-512.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add icon-180.png icon-512.png
            git commit -m "chore: sync I Was Here home screen icons"
            git push
          fi
